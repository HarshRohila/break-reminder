<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Break Reminder</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1e1e2e;
        color: #cdd6f4;
        width: 300px;
        height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        user-select: none;
        -webkit-app-region: drag;
      }

      .header {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6c7086;
      }

      .status {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .state-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .dot.working {
        background: #a6e3a1;
        box-shadow: 0 0 6px #a6e3a1aa;
      }

      .dot.break {
        background: #fab387;
        box-shadow: 0 0 6px #fab387aa;
      }

      #state-label {
        font-size: 18px;
        font-weight: 600;
        color: #cdd6f4;
      }

      #state-subtitle {
        font-size: 12px;
        color: #6c7086;
        padding-left: 20px;
      }

      .footer {
        display: flex;
        justify-content: flex-end;
        -webkit-app-region: no-drag;
      }

      button {
        background: none;
        border: 1px solid #313244;
        color: #6c7086;
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
      }

      button:hover {
        color: #cdd6f4;
        border-color: #6c7086;
      }
    </style>
  </head>
  <body>
    <div class="header">Break Reminder</div>
    <div class="status">
      <div class="state-row">
        <div id="state-dot" class="dot working"></div>
        <span id="state-label">Working</span>
      </div>
      <div id="state-subtitle">Loading…</div>
    </div>
    <div class="footer">
      <button id="quit-btn">Quit</button>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
